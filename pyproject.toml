[project]
name = "motor-rag"
version = "0.1.0"
description = "Question answering over Indian motor insurance policy wordings: hybrid retrieval, evals, a tool-calling agent and a Neo4j clause graph."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "neo4j>=5.20",
]

[dependency-groups]
dev = ["pytest>=8.0"]
# Embedding and reranking models. Kept separate so unit tests (which never load
# a model) can run in CI without downloading PyTorch.
ml = ["sentence-transformers>=3.0", "torch>=2.4"]

[tool.uv]
default-groups = ["dev", "ml"]

# On Linux (CI, Docker) use CPU-only PyTorch instead of the multi-GB CUDA build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motor_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
