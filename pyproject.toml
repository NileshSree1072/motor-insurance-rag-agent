[project]
name = "motor-rag"
version = "0.1.0"
description = "Question answering over Indian motor insurance policy wordings: hybrid retrieval, evals, a tool-calling agent and a Neo4j clause graph."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "neo4j>=5.20",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motor_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
